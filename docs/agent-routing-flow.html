&lt;script&gt;
  (() =&gt; {
    const root = document.getElementById('agent-routing-flow');
    const buttons = Array.from(root.querySelectorAll('[data-tier]'));
    const routeName = root.querySelector('#route-name');
    const routeModels = root.querySelector('#route-models');
    const implementerNote = root.querySelector('#implementer-note');
    const reviewerNote = root.querySelector('#reviewer-note');
    const finalNote = root.querySelector('#final-note');
    const tierDetail = root.querySelector('#tier-detail');
    const tiers = {
      0: {
        name: 'Tier 0 · 機械修改',
        models: ['Luna Low 實作', 'Luna Low review', '不跑 Sol'],
        implementer: 'Luna Low 實作；不帶入討論歷史。',
        reviewer: '固定驗證後，Luna Low reviewer 只看 handoff、diff 與測試結果。',
        final: 'Tier 0 不跑 Sol；review 通過後 ready_for_main。',
        scope: '文件、rename、格式或明確字串替換；不得改變 runtime behavior。'
      },
      1: {
        name: 'Tier 1 · 一般開發',
        models: ['Luna Medium 實作', 'Terra Low review', 'Sol Low final'],
        implementer: 'Luna Medium 實作；不帶入討論歷史。',
        reviewer: '固定驗證後，Terra Low reviewer 只看 handoff、diff 與測試結果。',
        final: 'Sol Low final 通過後，才 ready_for_main。',
        scope: '單一模組、需求明確、一般功能或 bug fix，且沒有高風險訊號。'
      },
      2: {
        name: 'Tier 2 · 高風險',
        models: ['Terra Medium 實作', 'Terra Medium review', 'Sol Medium final'],
        implementer: 'Terra Medium 實作；不帶入討論歷史。',
        reviewer: '完整 tests 後，Terra Medium reviewer 檢查跨檔案、資料與安全風險。',
        final: 'Sol Medium final 通過後，才 ready_for_main；health check 為必要 gate。',
        scope: '跨模組、migration、auth、安全、部署、並行、交易或 production data 風險。'
      }
    };
    function renderTier(key) {
      const tier = tiers[key];
      routeName.textContent = tier.name;
      routeModels.replaceChildren();
      tier.models.forEach((model, index) =&gt; {
        if (index) {
          const arrow = document.createElement('span');
          arrow.className = 'route-arrow';
          arrow.setAttribute('aria-hidden', 'true');
          arrow.textContent = '→';
          routeModels.append(arrow);
        }
        const badge = document.createElement('span');
        badge.className = 'viz-badge';
        badge.textContent = model;
        routeModels.append(badge);
      });
      implementerNote.textContent = tier.implementer;
      reviewerNote.textContent = tier.reviewer;
      finalNote.textContent = tier.final;
      tierDetail.innerHTML = '&lt;div class=&quot;text-muted text-small&quot;&gt;' + tier.name + ' 的適用範圍&lt;/div&gt;&lt;div&gt;' + tier.scope + '&lt;/div&gt;';
      buttons.forEach((button) =&gt; {
        const selected = button.dataset.tier === key;
        button.setAttribute('aria-pressed', String(selected));
        button.classList.toggle('btn-primary', selected);
      });
    }
    buttons.forEach((button) =&gt; button.addEventListener('click', () =&gt; renderTier(button.dataset.tier)));
  })();
&lt;/script&gt;
